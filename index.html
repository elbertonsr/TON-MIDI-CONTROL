<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>TON MIDI CONTROL</title>

<style>
        :root {
            /* TEMA PRETO, GRAFITE E PRATA */
            --bg-main: #000000;
            --bg-card: #141414;
            --bg-pad-zone: #0a0a0a;
            --accent-cyan: #00ffff;
            --accent-purple: #df80ff;
            --accent-orange: #ff6666;
            --accent-green: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #d0d0d0;
            --border-color: #333333;
            --silver-metallic: linear-gradient(135deg, #e0e0e0, #7a7a7a);
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed; top: 0; left: 0; height: 100%; width: 100%; overflow: hidden;
        }

        #start-overlay {
            position: fixed; inset: 0; background: linear-gradient(135deg, #000000, #141414);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--accent-cyan); cursor: pointer;
        }
        #start-overlay h2 { font-size: 2rem; margin-bottom: 10px; text-shadow: 0 0 15px rgba(0, 255, 255, 0.8); }
        #start-overlay p { color: var(--text-muted); font-size: 1rem; }

        .app-container { display: none; flex-direction: column; width: 100vw; height: 100vh; padding: 6px 12px; gap: 8px; }

        @media screen and (orientation: portrait) {
            .app-container, .modal-overlay { position: fixed; width: 100vh; height: 100vw; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(90deg); }
        }

        header { display: flex; justify-content: space-between; align-items: center; height: 28px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        
        .menu-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); font-size: 1.1rem; padding: 1px 8px; border-radius: 6px; cursor: pointer; }
        .logo-title { font-size: 0.8rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .midi-selector-wrapper { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 6px; height: 6px; background-color: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; }
        .status-dot.connected { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        select { background: #1a1a1a; color: var(--text-main); border: 1px solid var(--border-color); padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; outline: none; }

        .main-layout { display: flex; flex: 1; gap: 12px; min-height: 0; }
        .left-panel { display: flex; flex-direction: column; flex: 1; gap: 10px; min-width: 0; }

        .top-pads-section { display: flex; background-color: var(--bg-pad-zone); border: 1px solid var(--border-color); border-radius: 10px; height: 85px; padding: 6px 10px; gap: 15px; }
        .pads-row { display: flex; flex: 1; gap: 8px; }
        .pad-wrapper { flex: 1; display: flex; }
        
        .drum-pad { 
            width: 100%; flex: 1; border-radius: 6px; position: relative; transition: all 0.05s ease; border: 1px solid transparent; 
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, var(--pad-bg-start), var(--pad-bg-end)); border-color: var(--pad-border);
        }
        .drum-pad::after { content: ''; position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; pointer-events: none; }
        .pad-label { color: #ffffff; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,0,0,0.9); pointer-events: none; z-index: 2; }

        .drum-pad.active-touch { background: linear-gradient(135deg, var(--pad-active-start), var(--pad-active-end)); box-shadow: 0 0 20px var(--pad-shadow); border-color: #ffffff; }
        
        .drum-pad[data-color="purple"] { --pad-bg-start: #3d1a66; --pad-bg-end: #210d3a; --pad-border: rgba(223, 128, 255, 0.4); --pad-active-start: #df80ff; --pad-active-end: #f0abfc; --pad-shadow: rgba(223, 128, 255, 0.9); }
        .drum-pad[data-color="blue"]   { --pad-bg-start: #023e8a; --pad-bg-end: #001d3d; --pad-border: rgba(0, 255, 255, 0.4);   --pad-active-start: #00ffff; --pad-active-end: #48cae4; --pad-shadow: rgba(0, 255, 255, 0.9); }
        .drum-pad[data-color="orange"] { --pad-bg-start: #7c2a04; --pad-bg-end: #3d1402; --pad-border: rgba(255, 102, 102, 0.4); --pad-active-start: #ff6666; --pad-active-end: #ff8c66; --pad-shadow: rgba(255, 102, 102, 0.9); }
        .drum-pad[data-color="green"]  { --pad-bg-start: #082b20; --pad-bg-end: #04140f; --pad-border: rgba(0, 255, 204, 0.4);  --pad-active-start: #00ffcc; --pad-active-end: #a7c957; --pad-shadow: rgba(0, 255, 204, 0.9); }
        .drum-pad[data-color="red"]    { --pad-bg-start: #590913; --pad-bg-end: #2d0409; --pad-border: rgba(255, 8, 68, 0.4);   --pad-active-start: #ff0a54; --pad-active-end: #ff477e; --pad-shadow: rgba(255, 8, 68, 0.9); }

        .pad-separator { width: 1px; background: var(--border-color); height: 100%; }
        .pad-knob-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; }

        .mixer-section { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; flex: 1; min-height: 0; }
        .channel-strip { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
        
        .knob-dial-wrapper { position: relative; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; }
        .knob-dial { width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at center, #444, #111); border: 2px solid #555; position: relative; box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.8); cursor: ns-resize; z-index: 2; }
        .knob-indicator { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-135deg); transition: transform 0.05s ease; }
        .knob-indicator::after { content: ''; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 2px; height: 7px; background: var(--accent-purple); border-radius: 2px; box-shadow: 0 0 6px var(--accent-purple); }
        .led-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .knob-led { position: absolute; width: 3px; height: 3px; background: #222; border-radius: 1px; transition: background 0.05s; }
        .knob-led.on { background: var(--accent-purple); box-shadow: 0 0 6px var(--accent-purple); }

        .label-display { width: 100%; text-align: center; font-size: 0.6rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; margin: 2px 0; }
        
        .slider-container { position: relative; width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; margin: 4px 0; }
        .fader-led-strip { position: absolute; width: 6px; height: 95px; display: flex; flex-direction: column-reverse; pointer-events: none; z-index: 1; justify-content: space-between; padding: 2px 0; }
        .fader-led { width: 100%; height: 5px; background: #222; border-radius: 1px; transition: background 0.05s; }
        .fader-led.on { background: var(--accent-cyan); box-shadow: 0 0 6px var(--accent-cyan); }
        
        .slider-container input[type="range"] { -webkit-appearance: none; appearance: none; position: absolute; width: 95px; height: 6px; background: transparent; border-radius: 2px; outline: none; transform: rotate(-90deg); transform-origin: center center; z-index: 2; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 50px; background: var(--silver-metallic); border-radius: 4px; cursor: pointer; box-shadow: 0 0 10px rgba(255, 255, 255, 0.2), 0 4px 5px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.5); }

        .strip-btn { width: 100%; height: 38px; background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; cursor: pointer; transition: all 0.2s ease; margin-top: 2px; }
        .strip-btn.active { background: linear-gradient(135deg, rgba(0,255,255,0.15), rgba(0,255,255,0.3)); border-color: var(--accent-cyan); box-shadow: inset 0 0 8px rgba(0,255,255,0.2), 0 0 10px rgba(0,255,255,0.1); }

        .scenes-section { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; width: 60px; height: 100%; }
        .midi-btn { width: 100%; height: 100%; background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.25); color: var(--text-muted); border-radius: 6px; font-size: 0.75rem; font-weight: bold; transition: all 0.2s ease; }
        .midi-btn.scene-btn.active { background: linear-gradient(135deg, rgba(0,255,255,0.15), rgba(0,255,255,0.3)); border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: inset 0 0 8px rgba(0,255,255,0.2), 0 0 10px rgba(0,255,255,0.2); }
        
        .midi-btn.leslie-btn { background: linear-gradient(135deg, #990000, #cc0000); color: #fff; border-color: #ff3333; }
        .midi-btn.leslie-btn.active { background: linear-gradient(135deg, #009900, #00cc00); color: #fff; border-color: #33ff33; box-shadow: 0 0 15px rgba(0, 204, 0, 0.5); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; width: 90%; max-width: 400px; max-height: 90%; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .modal-title { color: var(--accent-cyan); font-size: 1rem; text-align: center; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        /* CORREÇÃO PROFISSIONAL DE ROLAGEM DE MENU NO MOBILE */
        .scrollable-inputs { flex: 1; min-height: 0; overflow-y: auto; padding-right: 8px; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y !important; overscroll-behavior: contain; }
        .scrollable-inputs * { touch-action: pan-y !important; }
        .scrollable-inputs::-webkit-scrollbar { width: 5px; }
        .scrollable-inputs::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; }
        .scrollable-inputs::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .modal-btn { background: #222; color: #fff; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .modal-btn.primary { background: linear-gradient(135deg, var(--accent-cyan), #00b3b3); border: none; color: #000; }
        .form-group { display: flex; flex-direction: column; gap: 2px; }
        .form-group label { font-size: 0.65rem; color: var(--accent-purple); text-transform: uppercase; font-weight: bold; }
        .form-group input, .form-group select { background: #1a1a1a; color: #fff; border: 1px solid var(--border-color); padding: 6px; border-radius: 4px; font-size: 0.8rem; outline: none; }
        .form-group input:focus { border-color: var(--accent-cyan); }
    </style>


<style>
/* 🔧 Ajustes estruturais seguros */
body {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

/* Correção rotação */
@media screen and (orientation: portrait) {
    .app-container, .modal-overlay {
        position: fixed;
        width: 100vh;
        height: 100vw;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
    }
}

/* Área maior de toque dos faders */
.fader-hitbox {
    padding-top: 20px;
    padding-bottom: 20px;
}

/* Página 2 botões mais compridos */
.page2-button {
    height: 115%;
}
</style>

</head>

<body>


<div id="start-overlay">
<h2>TON Midi Control</h2>
<p>Toque para iniciar</p>
</div>
<div class="modal-overlay" id="main-menu">
<div class="modal-content">
<div class="modal-title">Configurações Avançadas</div>
<button class="modal-btn" id="btn-open-textos">Editar Textos</button>
<button class="modal-btn" id="btn-open-pads">Alterar Cores dos Pads</button>
<button class="modal-btn" id="btn-export-config">Exportar Configuração</button>
<button class="modal-btn" id="btn-import-config">Importar Configuração</button>
<input accept=".json" id="input-import-file" style="display: none;" type="file"/>
<button class="modal-btn primary" id="btn-close-main" style="margin-top: 5px;">Voltar</button>
</div>
</div>
<div class="modal-overlay" id="menu-textos">
<div class="modal-content">
<div class="modal-title">Editar Textos</div>
<div class="scrollable-inputs" id="text-inputs-container"></div>
<div style="display: flex; gap: 10px; margin-top: 5px;">
<button class="modal-btn primary" id="btn-save-textos" style="flex: 1;">Salvar</button>
<button class="modal-btn" id="btn-close-textos" style="flex: 1;">Cancelar</button>
</div>
</div>
</div>
<div class="modal-overlay" id="menu-pads">
<div class="modal-content">
<div class="modal-title">Alterar Cores dos Pads</div>
<div class="scrollable-inputs" id="pad-colors-container"></div>
<div style="display: flex; gap: 10px; margin-top: 5px;">
<button class="modal-btn primary" id="btn-save-pads" style="flex: 1;">Salvar</button>
<button class="modal-btn" id="btn-close-pads" style="flex: 1;">Cancelar</button>
</div>
</div>
</div>
<div class="app-container" id="app">
<header>
<div class="header-left">
<button class="menu-btn" id="hamburguer-btn">☰</button>
<div class="logo-title">TON Midi Control</div>
</div>
<div class="midi-selector-wrapper">
<button class="menu-btn" id="btn-toggle-page" style="font-size: 0.65rem; padding: 2px 6px; font-weight: bold; border-color: var(--accent-cyan); color: var(--accent-cyan);">PÁG 2</button>
<div class="status-dot" id="midi-status"></div>
<select id="midi-outputs"><option value="">Aguardando MIDI...</option></select>
</div>
</header>
<div class="main-layout" id="view-page-1">
<div class="left-panel">
<div class="top-pads-section">
<div class="pads-row">
<div class="pad-wrapper"><button class="drum-pad" data-cc="36" data-color="purple" id="pad-1"><span class="pad-label" id="lbl-p1">Bumbo</span></button></div>
<div class="pad-wrapper"><button class="drum-pad" data-cc="38" data-color="purple" id="pad-2"><span class="pad-label" id="lbl-p2">Caixa</span></button></div>
<div class="pad-wrapper"><button class="drum-pad" data-cc="42" data-color="purple" id="pad-3"><span class="pad-label" id="lbl-p3">H-Hat</span></button></div>
<div class="pad-wrapper"><button class="drum-pad" data-cc="46" data-color="purple" id="pad-4"><span class="pad-label" id="lbl-p4">Crash</span></button></div>
<div class="pad-wrapper"><button class="drum-pad" data-cc="47" data-color="purple" id="pad-5"><span class="pad-label" id="lbl-p5">Ride</span></button></div>
</div>
<div class="pad-separator"></div>
<div class="pad-knob-wrapper">
<div class="label-display" id="lbl-k6" style="color:var(--accent-purple)">Volume</div>
<div class="knob-dial-wrapper">
<div class="led-ring" id="ring-k6"></div>
<div class="knob-dial" data-cc="48" data-val="0" id="k6"><div class="knob-indicator" id="ind-k6"></div></div>
</div>
</div>
</div>
<div class="mixer-section">
<div class="channel-strip">
<div class="label-display" id="lbl-k1">Reverb</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k1"></div><div class="knob-dial" data-cc="25" data-val="0" id="k1"><div class="knob-indicator" id="ind-k1"></div></div></div>
<div class="slider-container"><div class="fader-led-strip" id="leds-f1"></div><input class="midi-slider" data-cc="20" id="f1" max="127" min="0" type="range" value="0"/></div>
<div class="label-display" id="lbl-f1" style="margin-top:2px; margin-bottom: 6px;">Master</div>
<button class="strip-btn" data-cc="50" data-status="0" id="b1"></button>
</div>
<div class="channel-strip">
<div class="label-display" id="lbl-k2">Delay</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k2"></div><div class="knob-dial" data-cc="26" data-val="0" id="k2"><div class="knob-indicator" id="ind-k2"></div></div></div>
<div class="slider-container"><div class="fader-led-strip" id="leds-f2"></div><input class="midi-slider" data-cc="21" id="f2" max="127" min="0" type="range" value="0"/></div>
<div class="label-display" id="lbl-f2" style="margin-top:2px; margin-bottom: 6px;">Expr</div>
<button class="strip-btn" data-cc="51" data-status="0" id="b2"></button>
</div>
<div class="channel-strip">
<div class="label-display" id="lbl-k3">Chorus</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k3"></div><div class="knob-dial" data-cc="27" data-val="0" id="k3"><div class="knob-indicator" id="ind-k3"></div></div></div>
<div class="slider-container"><div class="fader-led-strip" id="leds-f3"></div><input class="midi-slider" data-cc="22" id="f3" max="127" min="0" type="range" value="0"/></div>

</div>
<div class="channel-strip">
<div class="label-display" id="lbl-k4">Drive</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k4"></div><div class="knob-dial" data-cc="28" data-val="0" id="k4"><div class="knob-indicator" id="ind-k4"></div></div></div>
<div class="slider-container"><div class="fader-led-strip" id="leds-f4"></div><input class="midi-slider" data-cc="23" id="f4" max="127" min="0" type="range" value="0"/></div>

</div>
<div class="channel-strip">
<div class="label-display" id="lbl-k5">Pan</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k5"></div><div class="knob-dial" data-cc="29" data-val="0" id="k5"><div class="knob-indicator" id="ind-k5"></div></div></div>
<div class="slider-container"><div class="fader-led-strip" id="leds-f5"></div><input class="midi-slider" data-cc="24" id="f5" max="127" min="0" type="range" value="0"/></div>

</div>
</div>

<button class="midi-btn scene-btn" data-cc="30" data-val="127" id="s1"><span id="lbl-s1">S1</span></button>

<button class="midi-btn scene-btn" data-cc="33" data-val="127" id="s4"><span id="lbl-s4">S4</span></button>

<div style="display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; flex: 2; height: 100%; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px;">
<button class="strip-btn" data-cc="80" data-status="0" id="b7"><span id="lbl-b7" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">C</span></button>
<button class="strip-btn" data-cc="81" data-status="0" id="b8"><span id="lbl-b8" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">C#</span></button>
<button class="strip-btn" data-cc="82" data-status="0" id="b9"><span id="lbl-b9" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">D</span></button>
<button class="strip-btn" data-cc="83" data-status="0" id="b10"><span id="lbl-b10" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">D#</span></button>
<button class="strip-btn" data-cc="84" data-status="0" id="b11"><span id="lbl-b11" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">E</span></button>
<button class="strip-btn" data-cc="85" data-status="0" id="b12"><span id="lbl-b12" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">F</span></button>
<button class="strip-btn" data-cc="86" data-status="0" id="b13"><span id="lbl-b13" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">F#</span></button>
<button class="strip-btn" data-cc="87" data-status="0" id="b14"><span id="lbl-b14" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">G</span></button>
<button class="strip-btn" data-cc="88" data-status="0" id="b15"><span id="lbl-b15" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">G#</span></button>
<button class="strip-btn" data-cc="89" data-status="0" id="b16"><span id="lbl-b16" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">A</span></button>
<button class="strip-btn" data-cc="90" data-status="0" id="b17"><span id="lbl-b17" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">A#</span></button>
<button class="strip-btn" data-cc="91" data-status="0" id="b18"><span id="lbl-b18" style="color: var(--text-muted); font-size: 0.65rem; font-weight: bold; pointer-events: none;">B</span></button>
</div>
<div class="channel-strip" style="flex: 0.5; height: 100%; justify-content: center; align-items: center; padding: 15px 0;">
<div class="label-display" id="lbl-f7" style="margin-bottom: 8px;">Volume</div>
<div class="slider-container" style="height: 100%; width: 100%;">
<div class="fader-led-strip" id="leds-f7"></div>
<input class="midi-slider" data-cc="70" id="f7" max="127" min="0" type="range" value="0"/>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; flex: 2; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; justify-content: space-around; height: 100%;">
<div style="display: flex; justify-content: space-around; width: 100%;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
<div class="label-display" id="lbl-k8">Knob 1</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k8"></div><div class="knob-dial" data-cc="92" data-val="0" id="k8"><div class="knob-indicator" id="ind-k8"></div></div></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
<div class="label-display" id="lbl-k9">Knob 2</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k9"></div><div class="knob-dial" data-cc="93" data-val="0" id="k9"><div class="knob-indicator" id="ind-k9"></div></div></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
<div class="label-display" id="lbl-k10">Knob 3</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k10"></div><div class="knob-dial" data-cc="94" data-val="0" id="k10"><div class="knob-indicator" id="ind-k10"></div></div></div>
</div>
</div>
<div style="display: flex; justify-content: space-around; width: 100%; padding: 0 10%;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
<div class="label-display" id="lbl-k11">Knob 4</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k11"></div><div class="knob-dial" data-cc="95" data-val="0" id="k11"><div class="knob-indicator" id="ind-k11"></div></div></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
<div class="label-display" id="lbl-k12">Knob 5</div>
<div class="knob-dial-wrapper"><div class="led-ring" id="ring-k12"></div><div class="knob-dial" data-cc="96" data-val="0" id="k12"><div class="knob-indicator" id="ind-k12"></div></div></div>
</div>
</div>
</div>
</div>
</div>
<script>
        // --- CACHE CENTRALIZADO (ALTA PERFORMANCE) ---
        const UI = {
            mainMenu: document.getElementById('main-menu'), textMenu: document.getElementById('menu-textos'), padMenu: document.getElementById('menu-pads'),
            textContainer: document.getElementById('text-inputs-container'), padContainer: document.getElementById('pad-colors-container'),
            leslie: document.getElementById('leslie-switch'), app: document.getElementById('app'), overlay: document.getElementById('start-overlay'),
            midiStatus: document.getElementById('midi-status'), midiOutputs: document.getElementById('midi-outputs'),
            btnTogglePage: document.getElementById('btn-toggle-page'), viewPage1: document.getElementById('view-page-1'), viewPage2: document.getElementById('view-page-2'),
            sliders: [], knobs: [], stripBtns: [], cache: {}
        };

        function getEl(id) { if (!UI.cache[id]) UI.cache[id] = document.getElementById(id); return UI.cache[id]; }

        // MATRIZ ATUALIZADA: Todos os IDs de rótulos mapeados, incluindo a Página 2
        const labelsToEdit = [
            'k1','k2','k3','k4','k5','k6','k7','k8','k9','k10','k11','k12',
            'f1','f2','f3','f4','f5','f6','f7',
            'p1','p2','p3','p4','p5',
            's1','s2','s3','s4','s5',
            'b7','b8','b9','b10','b11','b12','b13','b14','b15','b16','b17','b18'
        ];

        function initDOMCache() {
            UI.sliders = Array.from(document.querySelectorAll('.midi-slider'));
            UI.knobs = Array.from(document.querySelectorAll('.knob-dial'));
            UI.stripBtns = Array.from(document.querySelectorAll('.strip-btn'));
        }

        function createLEDs() {
            document.querySelectorAll('.led-ring').forEach(ring => {
                if(ring.children.length > 0) return;
                for(let i=0; i<11; i++) {
                    let led = document.createElement('div'); led.className = 'knob-led';
                    let rad = (-135 + (i * 27)) * Math.PI / 180;
                    led.style.left = `${26 + 25 * Math.sin(rad) - 1.5}px`; led.style.top = `${26 - 25 * Math.cos(rad) - 1.5}px`; 
                    led.style.transform = `rotate(${-135 + (i * 27)}deg)`;
                    ring.appendChild(led);
                }
            });
            document.querySelectorAll('.fader-led-strip').forEach(strip => {
                if(strip.children.length > 0) return;
                for(let i=0; i<10; i++) { let led = document.createElement('div'); led.className = 'fader-led'; strip.appendChild(led); }
            });
        }

        function buildPadColorsMenu() {
            UI.padContainer.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const div = document.createElement('div'); div.className = 'form-group';
                div.innerHTML = `<label>Pad ${i}</label><select id="color-p${i}"><option value="purple">Padrão (Roxo)</option><option value="blue">Azul</option><option value="orange">Laranja</option><option value="green">Verde</option><option value="red">Vermelho</option></select>`;
                UI.padContainer.appendChild(div);
            }
        }

        // --- AUTOSAVE E CONFIG ---
        let saveTimeout;
        function queueSave() { clearTimeout(saveTimeout); saveTimeout = setTimeout(() => { autoSaveConfig(); }, 500); }

        function autoSaveConfig() {
            const config = { labels: {}, colors: {}, faders: {}, knobs: {}, buttons: {}, leslie: "0" };
            labelsToEdit.forEach(id => { const el = getEl(`lbl-${id}`); if (el) config.labels[id] = el.textContent; });
            for (let i=1; i<=5; i++) { const el = getEl(`pad-${i}`); if (el) config.colors[`p${i}`] = el.getAttribute('data-color') || 'purple'; }
            UI.sliders.forEach(s => config.faders[s.id] = s.value);
            UI.knobs.forEach(k => config.knobs[k.id] = k.getAttribute('data-val'));
            UI.stripBtns.forEach(b => config.buttons[b.id] = b.getAttribute('data-status'));
            config.leslie = UI.leslie.getAttribute('data-status') || '0';
            localStorage.setItem('ton_config', JSON.stringify(config));
        }

        function loadConfig() {
            const raw = localStorage.getItem('ton_config');
            let config = raw ? JSON.parse(raw) : { labels: {}, colors: {}, faders: {}, knobs: {}, buttons: {}, leslie: "0" };

            labelsToEdit.forEach(id => { const text = config.labels[id] || localStorage.getItem(`ton_lbl_${id}`); if (text && getEl(`lbl-${id}`)) getEl(`lbl-${id}`).textContent = text; });
            for (let i=1; i<=5; i++) { let c = config.colors[`p${i}`] || localStorage.getItem(`ton_color_p${i}`); if (c) { if(c.startsWith('pad-')) c = c.replace('pad-', ''); getEl(`pad-${i}`).setAttribute('data-color', c); } }
            UI.sliders.forEach(s => { s.value = config.faders[s.id] || 0; renderFader(s.id, s.value); });
            UI.knobs.forEach(k => { renderKnob(k, parseInt(config.knobs[k.id] || k.getAttribute('data-val') || 0)); });
            UI.stripBtns.forEach(b => { const st = config.buttons[b.id] || '0'; b.setAttribute('data-status', st); b.classList.toggle('active', st === '1'); });
            const ls = config.leslie || '0'; UI.leslie.setAttribute('data-status', ls); UI.leslie.classList.toggle('active', ls === '1');
            if(!raw) autoSaveConfig();
        }

        // --- 1. EXPORTAR / IMPORTAR CONFIGURAÇÃO ---
        document.getElementById('btn-export-config').addEventListener('click', () => {
            const data = localStorage.getItem('ton_config') || '{}';
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'ton_config.json';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        });

        document.getElementById('btn-import-config').addEventListener('click', () => document.getElementById('input-import-file').click());

        document.getElementById('input-import-file').addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (parsed && typeof parsed === 'object') {
                        localStorage.setItem('ton_config', JSON.stringify(parsed));
                        loadConfig(); UI.mainMenu.style.display = 'none';
                    }
                } catch(err) { console.error("Erro na leitura do arquivo JSON."); }
            };
            reader.readAsText(file);
        });

        // --- 5. ALTERNAR PÁGINAS ---
        UI.btnTogglePage.addEventListener('click', () => {
            const isPage1 = UI.viewPage1.style.display !== 'none';
            UI.viewPage1.style.display = isPage1 ? 'none' : 'flex';
            UI.viewPage2.style.display = isPage1 ? 'flex' : 'none';
            UI.btnTogglePage.textContent = isPage1 ? 'PÁG 1' : 'PÁG 2';
        });

        // --- EVENT DELEGATION CLICKS E MENUS ---
        document.addEventListener('click', (e) => {
            const target = e.target;
            if (target.id === 'hamburguer-btn') { UI.mainMenu.style.display = 'flex'; return; }
            if (target.id === 'btn-close-main') { UI.mainMenu.style.display = 'none'; return; }
            if (target.id === 'btn-close-textos') { UI.textMenu.style.display = 'none'; return; }
            if (target.id === 'btn-close-pads') { UI.padMenu.style.display = 'none'; return; }

            if (target.id === 'btn-open-textos') {
                UI.mainMenu.style.display = 'none'; UI.textContainer.innerHTML = '';
                labelsToEdit.forEach(id => {
                    const lbl = getEl('lbl-' + id); if(!lbl) return;
                    const div = document.createElement('div'); div.className = 'form-group';
                    // ADAPTADO: Detecção do tipo agora inclui Botões ('b')
                    let typeName = id.startsWith('k') ? 'Knob' : id.startsWith('f') ? 'Fader' : id.startsWith('s') ? 'Scene' : id.startsWith('b') ? 'Botão' : 'Pad';
                    div.innerHTML = `<label>${typeName} ${id.toUpperCase()}</label><input type="text" id="input-edit-${id}" value="${lbl.textContent}">`;
                    UI.textContainer.appendChild(div);
                });
                UI.textMenu.style.display = 'flex'; return;
            }

            if (target.id === 'btn-save-textos') {
                labelsToEdit.forEach(id => { const input = getEl(`input-edit-${id}`); if (input) getEl(`lbl-${id}`).textContent = input.value; });
                UI.textMenu.style.display = 'none'; queueSave(); return;
            }

            if (target.id === 'btn-open-pads') {
                UI.mainMenu.style.display = 'none';
                for (let i=1; i<=5; i++) { const sel = getEl(`color-p${i}`); if(sel) sel.value = getEl(`pad-${i}`).getAttribute('data-color') || 'purple'; }
                UI.padMenu.style.display = 'flex'; return;
            }

            if (target.id === 'btn-save-pads') {
                for (let i=1; i<=5; i++) { const sel = getEl(`color-p${i}`); if(sel) getEl(`pad-${i}`).setAttribute('data-color', sel.value); }
                UI.padMenu.style.display = 'none'; queueSave(); return;
            }

            const stripBtn = target.closest('.strip-btn');
            if (stripBtn) {
                let state = stripBtn.getAttribute('data-status') === '1' ? '0' : '1';
                stripBtn.setAttribute('data-status', state); stripBtn.classList.toggle('active', state === '1');
                sendControlChange(parseInt(stripBtn.getAttribute('data-cc')), state === '1' ? 127 : 0); queueSave(); return;
            }

            const leslieBtn = target.closest('#leslie-switch');
            if (leslieBtn) {
                let state = leslieBtn.getAttribute('data-status') === '1' ? '0' : '1';
                leslieBtn.setAttribute('data-status', state); leslieBtn.classList.toggle('active', state === '1');
                sendControlChange(parseInt(leslieBtn.getAttribute('data-cc')), state === '1' ? 127 : 0); queueSave(); return;
            }
        });

        document.addEventListener('input', (e) => { if (e.target.classList.contains('midi-slider')) { renderFader(e.target.id, e.target.value); sendControlChange(parseInt(e.target.getAttribute('data-cc')), parseInt(e.target.value)); } });
        document.addEventListener('change', (e) => { if (e.target.classList.contains('midi-slider')) queueSave(); if (e.target.id === 'midi-outputs' && midiAccess) midiOutput = midiAccess.outputs.get(e.target.value); });

        // --- 2. MIDI IN E OUT COM SINCRONIZAÇÃO OTIMIZADA ---
        let midiAccess = null; let midiOutput = null;
        if (navigator.requestMIDIAccess) navigator.requestMIDIAccess().then(onMIDISuccess, () => console.warn("MIDI negado."));

        function onMIDISuccess(midi) { 
            midiAccess = midi; updateOutputs(); updateInputs(); 
            midiAccess.onstatechange = () => { updateOutputs(); updateInputs(); }; 
        }

        function updateOutputs() {
            const outputs = midiAccess.outputs; UI.midiOutputs.innerHTML = '';
            if (outputs.size === 0) { UI.midiOutputs.innerHTML = '<option value="">Sem Saída MIDI</option>'; UI.midiStatus.classList.remove('connected'); midiOutput = null; return; }
            UI.midiStatus.classList.add('connected');
            outputs.forEach(out => { const opt = document.createElement('option'); opt.value = out.id; opt.textContent = out.name.substring(0, 20); UI.midiOutputs.appendChild(opt); });
            midiOutput = outputs.get(UI.midiOutputs.value);
        }

        function updateInputs() { midiAccess.inputs.forEach(input => input.onmidimessage = handleIncomingMIDI); }

        function handleIncomingMIDI(msg) {
            const [status, ccOrNote, value] = msg.data;
            const cmd = status & 0xF0;

            if (cmd === 0xB0) { // Control Change (Sincroniza Faders, Knobs, Botões)
                UI.sliders.forEach(s => { if (parseInt(s.getAttribute('data-cc')) === ccOrNote) { s.value = value; renderFader(s.id, value); }});
                UI.knobs.forEach(k => { if (parseInt(k.getAttribute('data-cc')) === ccOrNote) renderKnob(k, value); });
                UI.stripBtns.forEach(b => { if (parseInt(b.getAttribute('data-cc')) === ccOrNote) { let on = value >= 64; b.setAttribute('data-status', on ? '1' : '0'); b.classList.toggle('active', on); }});
                if (parseInt(UI.leslie.getAttribute('data-cc')) === ccOrNote) { let on = value >= 64; UI.leslie.setAttribute('data-status', on ? '1' : '0'); UI.leslie.classList.toggle('active', on); }
            }
            // Sincroniza PADS e SCENES caso o Software envie Feedback de Note On/Off
            else if (cmd === 0x90 || cmd === 0x80) {
                let isOn = cmd === 0x90 && value > 0;
                document.querySelectorAll('.drum-pad').forEach(p => { if (parseInt(p.getAttribute('data-cc')) === ccOrNote) p.classList.toggle('active-touch', isOn); });
                document.querySelectorAll('.scene-btn').forEach(s => { if (parseInt(s.getAttribute('data-cc')) === ccOrNote) s.classList.toggle('active', isOn); });
            }
        }

        function sendControlChange(cc, value) { if (midiOutput) midiOutput.send([0xB0, cc, value]); }

        // --- RENDERIZADORES ---
        function renderKnob(knobEl, value) {
            knobEl.setAttribute('data-val', value);
            const indicator = getEl('ind-' + knobEl.id); if (indicator) indicator.style.transform = `rotate(${-135 + (value / 127) * 270}deg)`;
            let activeLeds = Math.round((value / 127) * 11);
            const ring = getEl('ring-' + knobEl.id);
            if (ring) ring.querySelectorAll('.knob-led').forEach((led, idx) => led.classList.toggle('on', idx < activeLeds));
        }

        function renderFader(sliderId, value) {
            let activeLeds = Math.round((value / 127) * 10);
            const strip = getEl('leds-' + sliderId);
            if (strip) strip.querySelectorAll('.fader-led').forEach((led, idx) => led.classList.toggle('on', idx < activeLeds));
        }

        // --- DRAG DE KNOBS ---
        let activeKnob = null; let knobStartY = 0; let knobStartVal = 0; let knobRafId = null;

        function onKnobDrag(e) {
            if(!activeKnob) return; e.preventDefault();
            let isPortrait = window.innerHeight > window.innerWidth; let delta;
            if (isPortrait) { let x = e.type.includes('touch') ? e.touches[0].clientX : e.clientX; delta = x - knobStartY; } 
            else { let y = e.type.includes('touch') ? e.touches[0].clientY : e.clientY; delta = knobStartY - y; }
            
            let newVal = Math.max(0, Math.min(127, knobStartVal + Math.round(delta * 1.2))); 
            
            if (knobRafId) cancelAnimationFrame(knobRafId);
            knobRafId = requestAnimationFrame(() => { renderKnob(activeKnob, newVal); sendControlChange(parseInt(activeKnob.getAttribute('data-cc')), newVal); });
        }

        function stopKnobDrag() { activeKnob = null; document.removeEventListener('touchmove', onKnobDrag); document.removeEventListener('mousemove', onKnobDrag); queueSave(); }

        // --- EVENTOS TÁTEIS: PADS, SCENES, KNOBS ---
        const handlePress = (e) => {
            const target = e.target;
            const knob = target.closest('.knob-dial');
            if (knob) {
                e.preventDefault(); activeKnob = knob;
                let isPortrait = window.innerHeight > window.innerWidth;
                knobStartY = isPortrait ? (e.type.includes('touch') ? e.touches[0].clientX : e.clientX) : (e.type.includes('touch') ? e.touches[0].clientY : e.clientY);
                knobStartVal = parseInt(activeKnob.getAttribute('data-val')) || 0;
                document.addEventListener('touchmove', onKnobDrag, {passive: false}); document.addEventListener('mousemove', onKnobDrag);
                document.addEventListener('touchend', stopKnobDrag); document.addEventListener('mouseup', stopKnobDrag); return;
            }

            const pad = target.closest('.drum-pad');
            if (pad) {
                if (e.type === 'touchstart') e.preventDefault();
                if (!pad.classList.contains('active-touch')) {
                    // 3. VIBRAÇÃO APENAS NOS PADS
                    if (navigator.vibrate) navigator.vibrate(25);
                    pad.classList.add('active-touch'); sendControlChange(parseInt(pad.getAttribute('data-cc')), 127);
                }
                return;
            }

            const scene = target.closest('.scene-btn');
            if (scene) {
                if (e.type === 'touchstart') e.preventDefault();
                if (!scene.classList.contains('active')) { scene.classList.add('active'); sendControlChange(parseInt(scene.getAttribute('data-cc')), parseInt(scene.getAttribute('data-val'))); }
                return;
            }
        };

        const handleRelease = (e) => {
            const target = e.target;
            const pad = target.closest('.drum-pad');
            if (pad) {
                if (e.type === 'touchend') e.preventDefault();
                if (pad.classList.contains('active-touch')) { pad.classList.remove('active-touch'); sendControlChange(parseInt(pad.getAttribute('data-cc')), 0); }
                return;
            }
            const scene = target.closest('.scene-btn');
            if (scene) {
                if (e.type === 'touchend') e.preventDefault();
                if (scene.classList.contains('active')) { scene.classList.remove('active'); sendControlChange(parseInt(scene.getAttribute('data-cc')), 0); }
                return;
            }
        };

        document.addEventListener('touchstart', handlePress, {passive: false}); document.addEventListener('mousedown', handlePress);
        document.addEventListener('touchend', handleRelease); document.addEventListener('mouseup', handleRelease); document.addEventListener('mouseleave', handleRelease, true);

        // --- SISTEMA INICIALIZADOR ---
        UI.overlay.addEventListener('click', async () => {
            try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
                  if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (err) {}
            UI.overlay.style.display = 'none'; UI.app.style.display = 'flex';
        });

        window.addEventListener('DOMContentLoaded', () => { initDOMCache(); createLEDs(); buildPadColorsMenu(); loadConfig(); });
    </script>


<script src="app.js"></script>
