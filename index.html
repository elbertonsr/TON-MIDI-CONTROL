<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>TON MIDI CONTROL</title>

<style>
        :root {
            /* TEMA PRETO, GRAFITE E PRATA */
            --bg-main: #000000;
            --bg-card: #141414;
            --bg-pad-zone: #0a0a0a;
            --accent-cyan: #00ffff;
            --accent-purple: #df80ff;
            --accent-orange: #ff6666;
            --accent-green: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #d0d0d0;
            --border-color: #333333;
            --silver-metallic: linear-gradient(135deg, #e0e0e0, #7a7a7a);
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed; top: 0; left: 0; height: 100%; width: 100%; overflow: hidden;
        }

        #start-overlay {
            position: fixed; inset: 0; background: linear-gradient(135deg, #000000, #141414);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--accent-cyan); cursor: pointer;
        }
        #start-overlay h2 { font-size: 2rem; margin-bottom: 10px; text-shadow: 0 0 15px rgba(0, 255, 255, 0.8); }
        #start-overlay p { color: var(--text-muted); font-size: 1rem; }

        .app-container { display: none; flex-direction: column; width: 100vw; height: 100vh; padding: 6px 12px; gap: 8px; }

        @media screen and (orientation: portrait) {
            .app-container, .modal-overlay { position: fixed; width: 100vh; height: 100vw; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(90deg); }
        }

        header { display: flex; justify-content: space-between; align-items: center; height: 28px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        
        .menu-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); font-size: 1.1rem; padding: 1px 8px; border-radius: 6px; cursor: pointer; }
        .logo-title { font-size: 0.8rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .midi-selector-wrapper { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 6px; height: 6px; background-color: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; }
        .status-dot.connected { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        select { background: #1a1a1a; color: var(--text-main); border: 1px solid var(--border-color); padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; outline: none; }

        .main-layout { display: flex; flex: 1; gap: 12px; min-height: 0; }
        .left-panel { display: flex; flex-direction: column; flex: 1; gap: 10px; min-width: 0; }

        .top-pads-section { display: flex; background-color: var(--bg-pad-zone); border: 1px solid var(--border-color); border-radius: 10px; height: 85px; padding: 6px 10px; gap: 15px; }
        .pads-row { display: flex; flex: 1; gap: 8px; }
        .pad-wrapper { flex: 1; display: flex; }
        
        .drum-pad { 
            width: 100%; flex: 1; border-radius: 6px; position: relative; transition: all 0.05s ease; border: 1px solid transparent; 
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, var(--pad-bg-start), var(--pad-bg-end)); border-color: var(--pad-border);
        }
        .drum-pad::after { content: ''; position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; pointer-events: none; }
        .pad-label { color: #ffffff; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,0,0,0.9); pointer-events: none; z-index: 2; }

        .drum-pad.active-touch { background: linear-gradient(135deg, var(--pad-active-start), var(--pad-active-end)); box-shadow: 0 0 20px var(--pad-shadow); border-color: #ffffff; }
        
        .drum-pad[data-color="purple"] { --pad-bg-start: #3d1a66; --pad-bg-end: #210d3a; --pad-border: rgba(223, 128, 255, 0.4); --pad-active-start: #df80ff; --pad-active-end: #f0abfc; --pad-shadow: rgba(223, 128, 255, 0.9); }
        .drum-pad[data-color="blue"]   { --pad-bg-start: #023e8a; --pad-bg-end: #001d3d; --pad-border: rgba(0, 255, 255, 0.4);   --pad-active-start: #00ffff; --pad-active-end: #48cae4; --pad-shadow: rgba(0, 255, 255, 0.9); }
        .drum-pad[data-color="orange"] { --pad-bg-start: #7c2a04; --pad-bg-end: #3d1402; --pad-border: rgba(255, 102, 102, 0.4); --pad-active-start: #ff6666; --pad-active-end: #ff8c66; --pad-shadow: rgba(255, 102, 102, 0.9); }
        .drum-pad[data-color="green"]  { --pad-bg-start: #082b20; --pad-bg-end: #04140f; --pad-border: rgba(0, 255, 204, 0.4);  --pad-active-start: #00ffcc; --pad-active-end: #a7c957; --pad-shadow: rgba(0, 255, 204, 0.9); }
        .drum-pad[data-color="red"]    { --pad-bg-start: #590913; --pad-bg-end: #2d0409; --pad-border: rgba(255, 8, 68, 0.4);   --pad-active-start: #ff0a54; --pad-active-end: #ff477e; --pad-shadow: rgba(255, 8, 68, 0.9); }

        .pad-separator { width: 1px; background: var(--border-color); height: 100%; }
        .pad-knob-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; }

        .mixer-section { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; flex: 1; min-height: 0; }
        .channel-strip { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; transition: background 0.2s ease, border-color 0.2s ease; }
        
        /* CORES CUSTOMIZADAS PARA O FUNDO DOS CANAIS DO MIXER */
        .channel-strip[data-color="purple"] { background: linear-gradient(135deg, #210d3a, #0b0414); border-color: rgba(223, 128, 255, 0.3); }
        .channel-strip[data-color="blue"]   { background: linear-gradient(135deg, #001d3d, #000a14); border-color: rgba(0, 255, 255, 0.3); }
        .channel-strip[data-color="orange"] { background: linear-gradient(135deg, #3d1402, #140600); border-color: rgba(255, 102, 102, 0.3); }
        .channel-strip[data-color="green"]  { background: linear-gradient(135deg, #04140f, #010504); border-color: rgba(0, 255, 204, 0.3); }
        .channel-strip[data-color="red"]    { background: linear-gradient(135deg, #2d0409, #0f0103); border-color: rgba(255, 8, 68, 0.3); }

        .knob-dial-wrapper { position: relative; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; }
        .knob-dial { width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at center, #444, #111); border: 2px solid #555; position: relative; box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.8); cursor: ns-resize; z-index: 2; }
        .knob-indicator { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-135deg); transition: transform 0.05s ease; }
        .knob-indicator::after { content: ''; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 2px; height: 7px; background: var(--accent-purple); border-radius: 2px; box-shadow: 0 0 6px var(--accent-purple); }
        .led-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .knob-led { position: absolute; width: 3px; height: 3px; background: #222; border-radius: 1px; transition: background 0.05s; }
        .knob-led.on { background: var(--accent-purple); box-shadow: 0 0 6px var(--accent-purple); }

        .label-display { width: 100%; text-align: center; font-size: 0.6rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; margin: 2px 0; }
        
        .slider-container { position: relative; width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; margin: 4px 0; }
        .fader-led-strip { position: absolute; width: 6px; height: 95px; display: flex; flex-direction: column-reverse; pointer-events: none; z-index: 1; justify-content: space-between; padding: 2px 0; }
        .fader-led { width: 100%; height: 5px; background: #222; border-radius: 1px; transition: background 0.05s; }
        .fader-led.on { background: var(--accent-cyan); box-shadow: 0 0 6px var(--accent-cyan); }
        
        .slider-container input[type="range"] { -webkit-appearance: none; appearance: none; position: absolute; width: 95px; height: 6px; background: transparent; border-radius: 2px; outline: none; transform: rotate(-90deg); transform-origin: center center; z-index: 2; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 50px; background: var(--silver-metallic); border-radius: 4px; cursor: pointer; box-shadow: 0 0 10px rgba(255, 255, 255, 0.2), 0 4px 5px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.5); }

        .strip-btn { width: 100%; height: 38px; background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; cursor: pointer; transition: all 0.2s ease; margin-top: 2px; }
        .strip-btn.active { background: linear-gradient(135deg, rgba(0,255,255,0.15), rgba(0,255,255,0.3)); border-color: var(--accent-cyan); box-shadow: inset 0 0 8px rgba(0,255,255,0.2), 0 0 10px rgba(0,255,255,0.1); }

        .scenes-section { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; width: 60px; height: 100%; }
        .midi-btn { width: 100%; height: 100%; background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.25); color: var(--text-muted); border-radius: 6px; font-size: 0.75rem; font-weight: bold; transition: all 0.2s ease; }
        .midi-btn.scene-btn.active { background: linear-gradient(135deg, rgba(0,255,255,0.15), rgba(0,255,255,0.3)); border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: inset 0 0 8px rgba(0,255,255,0.2), 0 0 10px rgba(0,255,255,0.2); }
        
        .midi-btn.leslie-btn { background: linear-gradient(135deg, #990000, #cc0000); color: #fff; border-color: #ff3333; }
        .midi-btn.leslie-btn.active { background: linear-gradient(135deg, #009900, #00cc00); color: #fff; border-color: #33ff33; box-shadow: 0 0 15px rgba(0, 204, 0, 0.5); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; width: 90%; max-width: 400px; max-height: 90%; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .modal-title { color: var(--accent-cyan); font-size: 1rem; text-align: center; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        /* CORREÇÃO PROFISSIONAL DE ROLAGEM DE MENU NO MOBILE */
        .scrollable-inputs { flex: 1; min-height: 0; overflow-y: auto; padding-right: 8px; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y !important; overscroll-behavior: contain; }
        .scrollable-inputs * { touch-action: pan-y !important; }
        .scrollable-inputs::-webkit-scrollbar { width: 5px; }
        .scrollable-inputs::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; }
        .scrollable-inputs::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .modal-btn { background: #222; color: #fff; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .modal-btn.primary { background: linear-gradient(135deg, var(--accent-cyan), #00b3b3); border: none; color: #000; }
        .form-group { display: flex; flex-direction: column; gap: 2px; }
        .form-group label { font-size: 0.65rem; color: var(--accent-purple); text-transform: uppercase; font-weight: bold; }
        .form-group input, .form-group select { background: #1a1a1a; color: #fff; border: 1px solid var(--border-color); padding: 6px; border-radius: 4px; font-size: 0.8rem; outline: none; }
        .form-group input:focus { border-color: var(--accent-cyan); }
    </style>

<style>
/* 🔧 Ajustes estruturais seguros */
body {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

/* Correção rotação */
@media screen and (orientation: portrait) {
    .app-container, .modal-overlay {
        position: fixed;
        width: 100vh;
        height: 100vw;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
    }
}

/* Área maior de toque dos faders */
.fader-hitbox {
    padding-top: 20px;
    padding-bottom: 20px;
}

/* Página 2 botões mais compridos */
.page2-button {
    height: 100%;
}

/* Customização do Menu Hamburguer em Tela Cheia com efeito de vidro e centralizado */
#main-menu {
    background: rgba(0, 0, 0, 0.3) !important;
    backdrop-filter: blur(15px) !important;
    -webkit-backdrop-filter: blur(15px) !important;
}

#main-menu .modal-content {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    max-height: none !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 12px !important;
    padding: 20px !important;
}

#main-menu .modal-btn {
    width: 75% !important;
    max-width: 280px !important;
    padding: 12px !important;
    font-size: 0.85rem !important;
    margin: 0 !important;
}

#main-menu .modal-title {
    font-size: 1.2rem !important;
    border-bottom: none !important;
    margin-bottom: 15px !important;
    text-transform: uppercase;
    letter-spacing: 1px;
}
</style>

</head>
